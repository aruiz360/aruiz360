name: Update repository count

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count private repositories
        env:
          GH_TOKEN: ${{ secrets.REPO_COUNT_TOKEN }}
        run: |
          count=$(gh api 'user/repos?affiliation=owner&visibility=private&per_page=100' --paginate --jq '.[].name' | wc -l | tr -d ' ')
          sed -i "s|<!-- repo-count -->.*<!-- /repo-count -->|<!-- repo-count -->Private repositories: ${count}<!-- /repo-count -->|" README.md
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update private repository count"
          git push
